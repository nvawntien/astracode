schema: spec-driven

context: |
  AstraCode is an online judge and interview-preparation platform with three tracks:
  DSA (free), Beyond LeetCode (premium), System Design (premium).
  Stack: Go microservices (auth, problem, submission), Kafka judge worker with the go-judge sandbox,
  Envoy edge, Next.js website, PostgreSQL, Redis, MinIO. Deployed on Azure.
  Non-goals: real payments, activity feed, Big-O analysis, plagiarism detection.
  Capabilities (one spec domain each) are listed in docs/product/frd.md §2.2.
  Terms: docs/process/glossary.md. Quality targets: docs/product/nfr.md (cite NFR IDs).
  Decisions: docs/architecture/adr/. Current code structure: docs/codebase/.

rules:
  proposal: |
    First line: "Implements: F-xx | Addresses: NFR-xx | Follows: ADR-xxxx" (omit parts that do not apply).
    State scope and explicit out-of-scope items. Reference PRD features by ID; do not copy PRD text.
  specs: |
    Behaviour only: requirements with SHALL and WHEN/THEN scenarios.
    No endpoints, table names, class names or file paths.
    Use glossary terms. Keep each capability spec under ~25 requirements.
  design: |
    Cite the architecture documents and NFR IDs it relies on.
    Interface changes: include contract drafts and mark them BREAKING or NON-BREAKING.
    List which architecture documents the change will update (doc impact).
  tasks: |
    5–15 tasks. Each task names its verification (test or command).
    Include tasks for doc impact and for tests covering every delta scenario.
