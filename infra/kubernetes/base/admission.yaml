apiVersion: v1
kind: PodTemplate
metadata:
  name: approved-auth-service
  namespace: astracode-app
  annotations:
    astracode.io/activation: closed
template:
  metadata:
    labels:
      app.kubernetes.io/name: auth-service
      astracode.io/template: auth-service
  spec:
    serviceAccountName: auth-service
    automountServiceAccountToken: false
    enableServiceLinks: false
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: astracode.io/node-role
              operator: In
              values:
              - app
    containers:
    - name: auth-service
      image: offline.invalid/astracode/auth-service@sha256:55f77d568ab55b6ac1d3042285e7e0ebe23854b96f3c2d0667790d705629172d
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: '1'
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
      - name: guard
        mountPath: /platform/launch-guard
        readOnly: true
      - name: auth-service-permits
        mountPath: /run/astra/permits
        readOnly: true
      - name: config
        mountPath: /app/config
        readOnly: true
      command:
      - /platform/launch-guard
      args:
      - auth-service
      - --
      - /app/app
      envFrom:
      - secretRef:
          name: auth-service-runtime
      readinessProbe:
        tcpSocket: &id001
          port: 8081
        periodSeconds: 5
      livenessProbe:
        tcpSocket: *id001
        periodSeconds: 20
        failureThreshold: 3
      startupProbe:
        tcpSocket: *id001
        periodSeconds: 5
        failureThreshold: 120
    volumes:
    - name: guard
      hostPath:
        path: /usr/local/libexec/astra/launch-guard
        type: File
    - name: auth-service-permits
      hostPath:
        path: /run/astracode/permits/auth-service
        type: Directory
    - name: config
      configMap:
        name: auth-service-config
    imagePullSecrets:
    - name: release-pull
    tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
---
