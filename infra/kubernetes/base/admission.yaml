apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: astracode-workloads
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: PodTemplate
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - replicasets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
        - astracode-app
        - astracode-judge
  variables:
  - name: label
    expression: object.metadata.labels["astracode.io/template"]
  - name: p
    expression: 'object.kind == "Pod" ? object.spec : object.spec.template.spec'
  - name: approved
    expression: params.template.spec
  - name: meta
    expression: 'object.kind == "Pod" ? object.metadata : object.spec.template.metadata'
  validations:
  - expression: params.template.metadata.labels["astracode.io/template"] == variables.label
  - expression: params.metadata.annotations["astracode.io/activation"] in ["backing", "authorized"] || (object.kind == "Deployment"
      && object.spec.replicas == 0) || (object.kind == "Job" && has(object.spec.suspend) && object.spec.suspend)
  - expression: variables.p.containers == variables.approved.containers
  - expression: variables.p.volumes == variables.approved.volumes
  - expression: variables.p.serviceAccountName == variables.approved.serviceAccountName
  - expression: has(variables.p.automountServiceAccountToken) && !variables.p.automountServiceAccountToken
  - expression: '!has(variables.p.nodeName) || (request.operation == "UPDATE" && object.kind == "Pod" && variables.p.nodeName
      == oldObject.spec.nodeName)'
  - expression: (!has(variables.p.hostNetwork) || !variables.p.hostNetwork) && (!has(variables.p.hostPID) || !variables.p.hostPID)
      && (!has(variables.p.hostIPC) || !variables.p.hostIPC)
  - expression: '!has(variables.p.shareProcessNamespace) || !variables.p.shareProcessNamespace'
  - expression: variables.p.affinity == variables.approved.affinity
  - expression: variables.p.tolerations.all(t, t in variables.approved.tolerations || (t.key == "node.kubernetes.io/memory-pressure"
      && t.operator == "Exists" && t.effect == "NoSchedule" && !has(t.tolerationSeconds) && !has(t.value)))
  - expression: object.kind == "Pod" || object.spec.template.metadata.labels["app.kubernetes.io/name"] == variables.label
  - expression: '!has(variables.p.initContainers)'
  - expression: '!has(variables.p.ephemeralContainers)'
  - expression: '!has(variables.p.hostAliases)'
  - expression: '!has(variables.p.runtimeClassName)'
  - expression: '!has(variables.p.dnsConfig)'
  - expression: '!has(variables.p.nodeSelector)'
  - expression: '!has(variables.p.resourceClaims)'
  - expression: '!has(variables.p.readinessGates)'
  - expression: has(variables.p.securityContext) == has(variables.approved.securityContext) && (!has(variables.p.securityContext)
      || variables.p.securityContext == variables.approved.securityContext)
  - expression: has(variables.p.imagePullSecrets) == has(variables.approved.imagePullSecrets) && (!has(variables.p.imagePullSecrets)
      || variables.p.imagePullSecrets == variables.approved.imagePullSecrets)
  - expression: has(variables.p.dnsPolicy) == has(variables.approved.dnsPolicy) && (!has(variables.p.dnsPolicy) || variables.p.dnsPolicy
      == variables.approved.dnsPolicy)
  - expression: has(variables.p.schedulerName) == has(variables.approved.schedulerName) && (!has(variables.p.schedulerName)
      || variables.p.schedulerName == variables.approved.schedulerName)
  - expression: has(variables.p.enableServiceLinks) == has(variables.approved.enableServiceLinks) && (!has(variables.p.enableServiceLinks)
      || variables.p.enableServiceLinks == variables.approved.enableServiceLinks)
  - expression: has(variables.p.hostUsers) == has(variables.approved.hostUsers) && (!has(variables.p.hostUsers) || variables.p.hostUsers
      == variables.approved.hostUsers)
  - expression: variables.p.restartPolicy == variables.approved.restartPolicy
  - expression: '!has(variables.p.priorityClassName) && !has(variables.p.schedulingGates)'
  - expression: '!has(variables.p.os) || variables.p.os.name == "linux"'
  - expression: object.kind != "Deployment" || (object.spec.strategy.type == "Recreate" && object.spec.replicas <= 1)
  - expression: '!has(variables.meta.annotations) || variables.meta.annotations.size() == 0'
  - expression: variables.meta.labels.all(k, k in ["app.kubernetes.io/name","astracode.io/template","astracode.io/environment","pod-template-hash","batch.kubernetes.io/controller-uid","batch.kubernetes.io/job-name","controller-uid","job-name"])
