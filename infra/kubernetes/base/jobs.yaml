apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-init
  namespace: astracode-app
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: astracode-app
  labels:
    app.kubernetes.io/name: kafka-init
    astracode.io/template: kafka-init
spec:
  suspend: true
  backoffLimit: 0
  parallelism: 1
  completions: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
        astracode.io/template: kafka-init
    spec:
      serviceAccountName: kafka-init
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: astracode.io/node-role
                operator: In
                values:
                - app
      containers:
      - name: kafka-init
        image: bitnamilegacy/kafka@sha256:aa0b2aee8c5610dd1d18d48b4f1df0dbe3267b5d4c338d36c9af9cbf0529c0b0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        command:
        - /bin/bash
        - /scripts/kafka-init.sh
      volumes:
      - name: scripts
        configMap:
          name: kafka-init-scripts
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      restartPolicy: Never
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: astracode-app
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: astracode-app
  labels:
    app.kubernetes.io/name: migrate
    astracode.io/template: migrate
spec:
  suspend: true
  backoffLimit: 0
  parallelism: 1
  completions: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        astracode.io/template: migrate
    spec:
      serviceAccountName: migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: astracode.io/node-role
                operator: In
                values:
                - app
      containers:
      - name: migrate
        image: offline.invalid/astracode/migrate@sha256:1cf318e5d2c054d5c7915eefdd52edfb71c146b18bcfeba21bb38a672a404d2b
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: guard
          mountPath: /platform/launch-guard
          readOnly: true
        - name: migrate-permits
          mountPath: /run/astra/permits
          readOnly: true
        - name: credentials
          mountPath: /run/astra/db
          readOnly: true
        command:
        - /platform/launch-guard
        args:
        - migrate
        - --
        - /usr/local/bin/astra-migrate
        env:
        - name: ASTRA_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      volumes:
      - name: guard
        hostPath:
          path: /usr/local/libexec/astra/launch-guard
          type: File
      - name: migrate-permits
        hostPath:
          path: /run/astracode/permits/migrate
          type: Directory
      - name: credentials
        secret:
          secretName: migrate-attempt
          defaultMode: 292
      imagePullSecrets:
      - name: release-pull
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      restartPolicy: Never
