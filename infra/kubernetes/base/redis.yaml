apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: astracode-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: astracode-app
  labels:
    astracode.io/template: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        astracode.io/template: redis
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: astracode.io/node-role
                operator: In
                values:
                - app
      containers:
      - name: redis
        image: redis@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 999
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --maxmemory
        - 128mb
        - --maxmemory-policy
        - allkeys-lru
        envFrom:
        - secretRef:
            name: redis-runtime
        readinessProbe:
          tcpSocket: &id001
            port: 6379
          periodSeconds: 5
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          failureThreshold: 3
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 5
          failureThreshold: 120
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
      securityContext:
        fsGroup: 999
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: astracode-app
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: tcp-6379
    port: 6379
    targetPort: 6379
