apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy
  namespace: astracode-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: astracode-app
  labels:
    astracode.io/template: envoy
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy
        astracode.io/template: envoy
    spec:
      serviceAccountName: envoy
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: astracode.io/node-role
                operator: In
                values:
                - app
      containers:
      - name: envoy
        image: envoyproxy/envoy@sha256:daca6a3f353ba289cc786d2162d13d4ec2b16d921c6c3f2fc57ce6f7900ab3d9
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: guard
          mountPath: /platform/launch-guard
          readOnly: true
        - name: envoy-permits
          mountPath: /run/astra/permits
          readOnly: true
        - name: config
          mountPath: /etc/envoy
          readOnly: true
        - name: jwk
          mountPath: /etc/envoy/secrets
          readOnly: true
        command:
        - /platform/launch-guard
        args:
        - envoy
        - --
        - envoy
        - -c
        - /etc/envoy/envoy.yaml
        - --log-level
        - warn
        readinessProbe:
          tcpSocket: &id001
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          failureThreshold: 3
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 5
          failureThreshold: 120
      volumes:
      - name: guard
        hostPath:
          path: /usr/local/libexec/astra/launch-guard
          type: File
      - name: envoy-permits
        hostPath:
          path: /run/astracode/permits/envoy
          type: Directory
      - name: config
        configMap:
          name: envoy-config
      - name: jwk
        secret:
          secretName: envoy-jwk
          defaultMode: 292
      imagePullSecrets:
      - name: release-pull
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: astracode-app
spec:
  selector:
    app.kubernetes.io/name: envoy
  ports:
  - name: tcp-8080
    port: 8080
    targetPort: 8080
