apiVersion: v1
kind: ServiceAccount
metadata:
  name: problem-service
  namespace: astracode-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: problem-service
  namespace: astracode-app
  labels:
    astracode.io/template: problem-service
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: problem-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: problem-service
        astracode.io/template: problem-service
    spec:
      serviceAccountName: problem-service
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: astracode.io/node-role
                operator: In
                values:
                - app
      containers:
      - name: problem-service
        image: offline.invalid/astracode/problem-service@sha256:c515c407858f214123d49c2e79790fc13c2c23ef44d1f38dc90e59b18ee78f6a
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: guard
          mountPath: /platform/launch-guard
          readOnly: true
        - name: problem-service-permits
          mountPath: /run/astra/permits
          readOnly: true
        - name: config
          mountPath: /app/config
          readOnly: true
        command:
        - /platform/launch-guard
        args:
        - problem-service
        - --
        - /app/app
        envFrom:
        - secretRef:
            name: problem-service-runtime
        readinessProbe:
          tcpSocket: &id001
            port: 8082
          periodSeconds: 5
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          failureThreshold: 3
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 5
          failureThreshold: 120
      volumes:
      - name: guard
        hostPath:
          path: /usr/local/libexec/astra/launch-guard
          type: File
      - name: problem-service-permits
        hostPath:
          path: /run/astracode/permits/problem-service
          type: Directory
      - name: config
        configMap:
          name: problem-service-config
      imagePullSecrets:
      - name: release-pull
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: problem-service
  namespace: astracode-app
spec:
  selector:
    app.kubernetes.io/name: problem-service
  ports:
  - name: tcp-8082
    port: 8082
    targetPort: 8082
  - name: tcp-9092
    port: 9092
    targetPort: 9092
