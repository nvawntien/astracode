apiVersion: v1
kind: ServiceAccount
metadata:
  name: submission-service
  namespace: astracode-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
  namespace: astracode-app
  labels:
    astracode.io/template: submission-service
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: submission-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: submission-service
        astracode.io/template: submission-service
    spec:
      serviceAccountName: submission-service
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: astracode.io/node-role
                operator: In
                values:
                - app
      containers:
      - name: submission-service
        image: offline.invalid/astracode/submission-service@sha256:eab587ff28f45a39fb5f306120686cc236be6385ff6838bf06d2d2922ff04bff
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: guard
          mountPath: /platform/launch-guard
          readOnly: true
        - name: submission-service-permits
          mountPath: /run/astra/permits
          readOnly: true
        - name: config
          mountPath: /app/config
          readOnly: true
        command:
        - /platform/launch-guard
        args:
        - submission-service
        - --
        - /app/app
        envFrom:
        - secretRef:
            name: submission-service-runtime
        env:
        - name: JUDGE_GRPC_ADDRESS
          value: judge-worker.astracode-judge.svc:9093
        readinessProbe:
          tcpSocket: &id001
            port: 8083
          periodSeconds: 5
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          failureThreshold: 3
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 5
          failureThreshold: 120
      volumes:
      - name: guard
        hostPath:
          path: /usr/local/libexec/astra/launch-guard
          type: File
      - name: submission-service-permits
        hostPath:
          path: /run/astracode/permits/submission-service
          type: Directory
      - name: config
        configMap:
          name: submission-service-config
      imagePullSecrets:
      - name: release-pull
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: submission-service
  namespace: astracode-app
spec:
  selector:
    app.kubernetes.io/name: submission-service
  ports:
  - name: tcp-8083
    port: 8083
    targetPort: 8083
