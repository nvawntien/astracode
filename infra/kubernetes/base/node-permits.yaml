apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migration-secret-delivery
  namespace: astracode-app
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [migrate-attempt, auth-service-runtime, problem-service-runtime, submission-service-runtime,
                  postgres-runtime, minio-runtime, redis-runtime, envoy-jwk]
  verbs: [get, patch]
---
