server:
  name: problem-service
  port: 8082
  grpc_port: 9092
  mode: release
logger:
  level: info
  filename: ''
  max_size: 10
  max_backups: 5
  max_age: 30
  compress: true
database:
  host: postgres
  port: 5432
  user: problem_runtime
  password: ''
  dbname: problem_db
  sslmode: disable
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 3600
redis:
  host: redis
  port: 6379
  password: ''
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
jwt:
  access_secret: ''
  refresh_secret: ''
  access_ttl: 15m
  refresh_ttl: 168h
minio:
  endpoint: minio.astracode-app.svc:9000
  access_key: ''
  secret_key: ''
  bucket: testcases
  use_ssl: false
