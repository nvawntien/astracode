apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: astracode-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: astracode-app
  labels:
    astracode.io/template: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        astracode.io/template: minio
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: astracode.io/node-role
                operator: In
                values:
                - app
      containers:
      - name: minio
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
        args:
        - server
        - /data
        envFrom:
        - secretRef:
            name: minio-runtime
        readinessProbe:
          tcpSocket: &id001
            port: 9000
          periodSeconds: 5
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          failureThreshold: 3
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 5
          failureThreshold: 120
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-data
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: astracode-app
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
  - name: tcp-9000
    port: 9000
    targetPort: 9000
