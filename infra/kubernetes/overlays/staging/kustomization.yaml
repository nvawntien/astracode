apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      astracode.io/environment: s2
    includeSelectors: false
patches:
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: tester
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`staging.invalid`)
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: smoke
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`smoke.staging.invalid`)
