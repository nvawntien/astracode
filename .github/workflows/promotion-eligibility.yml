name: Check promotion eligibility without deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic tag with an owner-reviewed canonical bundle mapping on main
        type: string
        required: true

      staging_run:
        description: Successful protected S2 delivery run for the mapped release
        type: string
        required: true

permissions:
  contents: read

jobs:
  request:
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    outputs:
      payload: ${{ steps.frozen.outputs.payload }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: frozen
        env:
          TAG: ${{ inputs.tag }}
          STAGING_RUN: ${{ inputs.staging_run }}
        run: python3 scripts/release/promotion.py prepare
  eligibility:
    needs: request
    if: vars.M013_DELIVERY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    environment: promotion-eligibility
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.ELIGIBILITY_READER_CLIENT_ID }}
          tenant-id: ${{ vars.S4_TENANT_ID }}
          subscription-id: ${{ vars.S4_SUBSCRIPTION_ID }}
      - name: Evaluate the frozen request against protected S2 evidence
        env:
          FROZEN_REQUEST: ${{ needs.request.outputs.payload }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_REVIEWER_IDS: ${{ vars.STAGING_REVIEWER_IDS }}
          PROMOTION_REVIEWER_IDS: ${{ vars.PROMOTION_REVIEWER_IDS }}
          RELEASE_RECORDS_ACCOUNT: ${{ vars.RELEASE_RECORDS_ACCOUNT }}
          CONTEST_WINDOWS: ${{ vars.CONTEST_WINDOWS }}
        run: python3 scripts/release/promotion.py evaluate
