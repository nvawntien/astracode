name: Check promotion eligibility without deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic tag with an owner-reviewed canonical bundle mapping on main
        type: string
        required: true

permissions:
  contents: read

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      payload: ${{ steps.frozen.outputs.payload }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: frozen
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/release/promotion.py prepare
  eligibility:
    needs: request
    if: vars.M013_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: promotion-eligibility
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned API client
        run: |
          python3 -m venv "$RUNNER_TEMP/eligibility-client"
          "$RUNNER_TEMP/eligibility-client/bin/pip" install azure-cli==2.76.0
          echo "$RUNNER_TEMP/eligibility-client/bin" >> "$GITHUB_PATH"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.ELIGIBILITY_READER_CLIENT_ID }}
          tenant-id: ${{ vars.S2_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Evaluate the frozen request against protected S2 evidence
        env:
          FROZEN_REQUEST: ${{ needs.request.outputs.payload }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVER_IDS: ${{ vars.PROMOTION_APPROVER_IDS }}
          CONTROLLER_ENDPOINT: ${{ vars.CONTROLLER_ENDPOINT }}
          CONTROLLER_AUDIENCE: ${{ vars.CONTROLLER_AUDIENCE }}
        run: python3 scripts/release/promotion.py evaluate
