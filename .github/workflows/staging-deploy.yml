name: Deploy an approved immutable staging release

on:
  workflow_dispatch:
    inputs:
      request:
        description: Exact slot, action, source and release/fallback digests
        required: true
        type: string

permissions:
  contents: read

jobs:
  request:
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    outputs:
      payload: ${{ steps.frozen.outputs.payload }}
      environment: ${{ steps.frozen.outputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: frozen
        env:
          REQUEST: ${{ inputs.request }}
        run: python3 -B scripts/release/delivery.py prepare
  deploy:
    name: Deploy approved release and run smoke
    needs: request
    if: vars.M013_DELIVERY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.request.outputs.environment }}
    concurrency:
      group: astracode-delivery-${{ needs.request.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.DELIVERY_CLIENT_ID }}
          tenant-id: ${{ vars.TARGET_TENANT_ID }}
          subscription-id: ${{ vars.TARGET_SUBSCRIPTION_ID }}
      - env:
          FROZEN_REQUEST: ${{ needs.request.outputs.payload }}
          TARGET_SUBSCRIPTION_ID: ${{ vars.TARGET_SUBSCRIPTION_ID }}
        run: python3 -B scripts/release/delivery.py deploy
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: staged-release-${{ github.run_id }}
          path: staged-release.json
          if-no-files-found: error
      - name: Admit testers after verified delivery
        env:
          TARGET_SUBSCRIPTION_ID: ${{ vars.TARGET_SUBSCRIPTION_ID }}
        run: python3 -B scripts/release/delivery.py admit
