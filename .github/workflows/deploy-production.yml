name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published semantic release tag (vX.Y.Z)
        required: true
        type: string
      legacy_from:
        description: Installed legacy release tag for a first protected rollout (leave blank for normal deployments)
        required: false
        type: string
      legacy_judge_peer:
        description: Private Judge IPv4 address as seen by Kafka (required with legacy_from)
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "image_tag must be a semantic release tag such as v1.2.3" >&2
            exit 1
          fi

      - name: Check out exact release configuration
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.image_tag }}
          fetch-depth: 0

      - name: Verify checked-out semantic tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          git rev-parse --verify "refs/tags/$IMAGE_TAG^{commit}" >/dev/null
          git tag --points-at HEAD | grep -Fx "$IMAGE_TAG" >/dev/null

      - name: Verify all release images exist in GHCR
        uses: docker/setup-buildx-action@v4

      - name: Authenticate for GHCR manifest inspection
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable release image manifests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          images=(website auth-service problem-service submission-service judge-worker sandbox)
          for image in "${images[@]}"; do
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}/${image}:${IMAGE_TAG}" >/dev/null
          done

      - name: Set up Go for the private contract probe
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.8'
          cache: false

      - name: Build the deployment probe
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -o /tmp/astracode-judge-rollout-probe ./pkg/cmd/judge-rollout-probe

      - name: Assemble non-secret node bundles
        run: |
          tar -czf /tmp/astracode-app-deployment.tgz \
            docker-compose.yml \
            docker-compose.prod.yml \
            envoy/envoy.prod.yaml \
            envoy/edge.lua \
            infra/kafka/kafka-init.sh \
            infra/postgres/init.sql \
            services/auth/config \
            services/problem/config \
            services/submission/config \
            scripts/deploy-app-node.sh \
            scripts/envoy-runtime.sh \
            scripts/deploy-app-bundle.py

          tar -czf /tmp/astracode-judge-deployment.tgz \
            scripts/deploy-judge-node.sh

      - name: Configure strict dual-node SSH
        env:
          PROD_APP_HOST: ${{ secrets.PROD_APP_HOST }}
          PROD_APP_PORT: ${{ secrets.PROD_APP_PORT }}
          PROD_APP_USER: ${{ secrets.PROD_APP_USER }}
          PROD_APP_SSH_KEY: ${{ secrets.PROD_APP_SSH_KEY }}
          PROD_JUDGE_HOST: ${{ secrets.PROD_JUDGE_HOST }}
          PROD_JUDGE_PORT: ${{ secrets.PROD_JUDGE_PORT }}
          PROD_JUDGE_USER: ${{ secrets.PROD_JUDGE_USER }}
          PROD_JUDGE_SSH_KEY: ${{ secrets.PROD_JUDGE_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          required=(
            PROD_APP_HOST PROD_APP_PORT PROD_APP_USER PROD_APP_SSH_KEY
            PROD_JUDGE_HOST PROD_JUDGE_PORT PROD_JUDGE_USER PROD_JUDGE_SSH_KEY
            PROD_KNOWN_HOSTS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production Environment secret: $name" >&2
              exit 1
            fi
          done

          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_APP_SSH_KEY" >"$HOME/.ssh/astracode_app"
          printf '%s\n' "$PROD_JUDGE_SSH_KEY" >"$HOME/.ssh/astracode_judge"
          printf '%s\n' "$PROD_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/astracode_app" "$HOME/.ssh/astracode_judge" "$HOME/.ssh/known_hosts"

          cat >"$HOME/.ssh/config" <<EOF
          Host astracode-app
            HostName $PROD_APP_HOST
            Port $PROD_APP_PORT
            User $PROD_APP_USER
            IdentityFile $HOME/.ssh/astracode_app
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts

          Host astracode-judge
            HostName $PROD_JUDGE_HOST
            Port $PROD_JUDGE_PORT
            User $PROD_JUDGE_USER
            IdentityFile $HOME/.ssh/astracode_judge
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ProxyJump astracode-app
          EOF
          chmod 0600 "$HOME/.ssh/config"

      - name: Upload non-secret bundles before activation
        id: upload
        run: |
          app_dir="$(ssh astracode-app 'mktemp -d /opt/astracode/.deploy/rollout.XXXXXXXX')"
          judge_dir="$(ssh astracode-judge 'mktemp -d /opt/astracode/.deploy/rollout.XXXXXXXX')"
          stage_pattern='^/opt/astracode/\.deploy/rollout\.[a-zA-Z0-9]{8}$'
          [[ "$app_dir" =~ $stage_pattern && "$judge_dir" =~ $stage_pattern ]]
          scp /tmp/astracode-app-deployment.tgz /tmp/astracode-judge-rollout-probe "astracode-app:$app_dir/"
          scp /tmp/astracode-judge-deployment.tgz /tmp/astracode-judge-rollout-probe "astracode-judge:$judge_dir/"
          printf 'app_dir=%s\njudge_dir=%s\n' "$app_dir" "$judge_dir" >> "$GITHUB_OUTPUT"

      - name: Suspend judging and deploy the verified App and Judge pair
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_UPLOAD_DIR: ${{ steps.upload.outputs.app_dir }}
          JUDGE_UPLOAD_DIR: ${{ steps.upload.outputs.judge_dir }}
          PROBE_PROBLEM_ID: ${{ vars.PROD_JUDGE_PROBE_PROBLEM_ID }}
          PROBE_TIME_LIMIT_MS: ${{ vars.PROD_JUDGE_PROBE_TIME_LIMIT_MS }}
          PROBE_MEMORY_LIMIT_KIB: ${{ vars.PROD_JUDGE_PROBE_MEMORY_LIMIT_KIB }}
          LEGACY_FROM: ${{ inputs.legacy_from }}
          LEGACY_JUDGE_PEER: ${{ inputs.legacy_judge_peer }}
        run: |
          python3 scripts/deploy-release-transition.py "$IMAGE_TAG" "$APP_UPLOAD_DIR" "$JUDGE_UPLOAD_DIR" \
            "$PROBE_PROBLEM_ID" "$PROBE_TIME_LIMIT_MS" "$PROBE_MEMORY_LIMIT_KIB" "$LEGACY_FROM" "$LEGACY_JUDGE_PEER"
