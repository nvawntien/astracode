name: Reconcile missing canonical releases

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/main' && vars.M013_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: canonical-publication
    permissions:
      contents: read
      id-token: write
    outputs:
      commits: ${{ steps.missing.outputs.commits }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned public tooling
        run: bash scripts/release/tools.sh --azure
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.RECEIPT_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.S4_TENANT_ID }}
          allow-no-subscriptions: true
      - id: missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RECORDS_ACCOUNT: ${{ vars.RELEASE_RECORDS_ACCOUNT }}
          M013_FIRST_MERGE: ${{ vars.M013_FIRST_MERGE }}
        run: python3 scripts/release/catalog.py discover
  candidate:
    needs: discover
    if: needs.discover.outputs.commits != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: ${{ fromJSON(needs.discover.outputs.commits) }}
    uses: nvawntien/astracode/.github/workflows/release-candidate.yml@main
    with:
      source: ${{ matrix.source }}
      kind: canonical
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
