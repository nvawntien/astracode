name: CI

on:
  workflow_call:
    inputs:
      git_ref:
        description: Full commit SHA to validate when called by release automation
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.git_ref }}

permissions:
  contents: read

jobs:
  go:
    name: Go checks (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg
          - services/auth
          - services/problem
          - services/submission
          - workers/judge
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25.8'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Race test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  postgres-integration:
    name: PostgreSQL integration suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25.8'
          cache-dependency-path: |
            services/problem/go.sum
            services/submission/go.sum

      - name: Run PostgreSQL integration suites
        run: bash scripts/test-postgres-integration.sh

      - name: Retain PostgreSQL fixture verification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: postgres-integration-evidence-${{ inputs.git_ref || github.sha }}
          path: |
            ${{ runner.temp }}/astracode-postgres.*/*/migration.log
            ${{ runner.temp }}/astracode-postgres.*/*/test.log
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (existing warning budget)
        run: npm run lint -- --max-warnings 6

      - name: Check tooling and test formatting
        run: npm run format:check:tooling

      - name: Unit tests
        run: npm test

      - name: Gateway client contract
        run: node --test ../envoy/tests/frontend.mjs

      - name: Build
        run: npm run build

  edge:
    name: Envoy routing and authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          fetch-depth: 0 # Independent pre-migration route oracle uses an immutable commit.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25.8'
          cache: false
      - name: Test local JWK generator
        run: go test envoy/gen_jwk.go envoy/gen_jwk_test.go
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r envoy/requirements.txt
      - run: python3 envoy/generate.py --check
      - run: python3 envoy/tests/route_parity.py
      - run: python3 envoy/tests/integration.py
      - run: python3 envoy/tests/deployment.py

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Validate development topology
        env:
          POSTGRES_ENV_FILE: ./environment/postgres.env.example
          REDIS_ENV_FILE: ./environment/redis.env.example
          SERVICE_ENV_FILE: ./environment/service.env.example
          GATEWAY_JWK_FILE: ./envoy/symmetric.json
        run: docker compose config --quiet

      - name: Validate App Node production topology
        env:
          POSTGRES_ENV_FILE: ./environment/postgres.prod.env.example
          REDIS_ENV_FILE: ./environment/redis.prod.env.example
          SERVICE_ENV_FILE: ./environment/service.prod.env.example
          GATEWAY_JWK_FILE: ./envoy/symmetric.json
          ASTRACODE_IMAGE_ROOT: ghcr.io/example/astracode
          ASTRACODE_IMAGE_TAG: v0.0.0-ci
        run: |
          docker compose \
            --project-name go-judge-system \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f environment/app-node.override.ci.yml \
            config --quiet

          docker compose \
            --project-name go-judge-system \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f environment/app-node.override.ci.yml \
            config --format json >/tmp/app-node-compose.json

          jq -e '
            .name == "go-judge-system" and
            (.services | has("gateway") | not) and
            (.services | has("go-judge") | not) and
            (.services | has("judge-worker") | not) and
            (.services.kafka.environment.KAFKA_HEAP_OPTS == "-Xms512m -Xmx512m") and
            (.services.kafka.deploy.resources.limits.memory == "1073741824") and
            (.services.kafka.deploy.resources.limits.cpus == 1) and
            (.services.kafka.healthcheck.test == ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]) and
            ((.services.kafka.healthcheck.test | join(" ") | contains("kafka-topics.sh")) | not) and
            ((.services.kafka.healthcheck.test | join(" ") | contains("kafka-broker-api-versions.sh")) | not) and
            ((.services.kafka.healthcheck.test | join(" ") | contains("java")) | not) and
            (.services.kafka.ports | any(.[]; .host_ip == "192.0.2.10" and .published == "9094" and .target == 9094)) and
            (.services["problem-service"].ports | any(.[]; .host_ip == "192.0.2.10" and .published == "9092" and .target == 9092)) and
            (.services.minio.ports | any(.[]; .host_ip == "192.0.2.10" and .published == "9000" and .target == 9000))
          ' /tmp/app-node-compose.json >/dev/null

  deployment-scripts:
    name: Deployment script checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Validate deployment and Kafka initialization scripts
        run: |
          bash -n scripts/deploy-app-node.sh
          bash -n scripts/envoy-runtime.sh
          python3 -c 'import ast; from pathlib import Path; ast.parse(Path("scripts/deploy-app-bundle.py").read_text())'
          bash -n scripts/deploy-judge-node.sh
          bash -n scripts/verify-judge-rollout-app.sh
          bash -n scripts/deploy-production.sh
          bash -n infra/kafka/kafka-init.sh
          python3 scripts/deploy-release-transition_test.py
          python3 -B scripts/release/test_policy.py
          python3 -B scripts/release/test_delivery.py
          python3 -B infra/azure/environment/tests/test_reviewed_apply.py
          PYTHONPATH=infra/azure/lifecycle:infra/postgres/managed:scripts/release python3 -B -m unittest discover -s infra/azure/lifecycle -p 'test_*.py'
          bash scripts/deploy-judge-node_test.sh

          grep -Fqx 'readonly KAFKA_READY_MAX_ATTEMPTS=30' infra/kafka/kafka-init.sh
          grep -Fqx 'readonly KAFKA_READY_RETRY_SECONDS=2' infra/kafka/kafka-init.sh
          grep -Fq 'for ((attempt = 1; attempt <= KAFKA_READY_MAX_ATTEMPTS; attempt++)); do' infra/kafka/kafka-init.sh
          # The assertions intentionally compare literal shell source.
          # shellcheck disable=SC2016
          grep -Fq '"$KAFKA_TOPICS_COMMAND" --bootstrap-server "$KAFKA_BOOTSTRAP_SERVER" --list' infra/kafka/kafka-init.sh
          grep -Fq 'Kafka did not become protocol-ready' infra/kafka/kafka-init.sh
          grep -Fqx 'wait_for_kafka_protocol || exit 1' infra/kafka/kafka-init.sh

          activation="$(sed -n '/^activate() {/,/^}/p' scripts/deploy-app-node.sh)"
          # shellcheck disable=SC2016
          required_activation_guards=(
            '  compose config --quiet || return 1'
            '  validate_envoy_runtime || return 1'
            '  compose pull "${APP_RELEASE_SERVICES[@]}" || return 1'
            '  compose up -d --pull never --timeout "${COMPOSE_STOP_TIMEOUT:-30}" kafka || return 1'
            '  compose up --no-deps --force-recreate --pull never --timeout "${COMPOSE_STOP_TIMEOUT:-30}" --exit-code-from kafka-init kafka-init || return 1'
            '  compose up -d --pull never --timeout "${COMPOSE_STOP_TIMEOUT:-30}" "${APP_SERVICES[@]}" || return 1'
            '  activate_envoy_runtime || return 1'
            '  compose ps || return 1'
            '  smoke_test || return 1'
            '  wait_for_services || return 1'
            '  configure_avatar_bucket || return 1'
          )
          for guard in "${required_activation_guards[@]}"; do
            grep -Fqx "$guard" <<<"$activation"
          done

          {
            cat <<'EOF'
          set -Eeuo pipefail
          APP_RELEASE_SERVICES=(website)
          APP_SERVICES=(website)
          compose_calls=()
          compose() {
            compose_calls+=("$*")
            return 0
          }
          source scripts/envoy-runtime.sh
          smoke_test() { return 0; }
          wait_for_services() { return 0; }
          configure_avatar_bucket() { return 0; }
          EOF
            printf '%s\n' "$activation"
            cat <<'EOF'
          activate
          expected_calls=(
            'config --quiet'
            'run --rm --no-deps envoy-jwk'
            'run --rm --no-deps envoy --mode validate -c /etc/envoy/envoy.yaml'
            'pull website'
            'up -d --pull never --timeout 30 kafka'
            'up --no-deps --force-recreate --pull never --timeout 30 --exit-code-from kafka-init kafka-init'
            'up -d --pull never --timeout 30 website'
            'up -d --no-deps --force-recreate --pull never --timeout 30 envoy'
            'ps'
          )
          [[ "${compose_calls[*]}" == "${expected_calls[*]}" ]]
          EOF
          } | bash

          {
            cat <<'EOF'
          set -Eeuo pipefail
          APP_RELEASE_SERVICES=(website)
          APP_SERVICES=(website)
          init_invoked=0
          remaining_app_started=0
          compose() {
            if [[ "$*" == 'up --no-deps --force-recreate --pull never --timeout 30 --exit-code-from kafka-init kafka-init' ]]; then
              init_invoked=1
              return 1
            fi
            if [[ "$*" == 'up -d --pull never --timeout 30 website' ]]; then
              remaining_app_started=1
            fi
            return 0
          }
          source scripts/envoy-runtime.sh
          smoke_test() { return 0; }
          wait_for_services() { return 0; }
          configure_avatar_bucket() { return 0; }
          EOF
            printf '%s\n' "$activation"
            cat <<'EOF'
          if activate; then
            echo 'failed kafka-init was accepted by App activation' >&2
            exit 1
          fi
          [[ "$init_invoked" -eq 1 ]]
          [[ "$remaining_app_started" -eq 0 ]]
          EOF
          } | bash

          {
            cat <<'EOF'
          set -Eeuo pipefail
          APP_RELEASE_SERVICES=(website)
          APP_SERVICES=(website)
          compose() { return 0; }
          source scripts/envoy-runtime.sh
          smoke_test() { return 0; }
          wait_for_services() { return 1; }
          configure_avatar_bucket() {
            echo 'post-deployment configuration must not run after a failed health gate' >&2
            return 0
          }
          EOF
            printf '%s\n' "$activation"
            cat <<'EOF'
          if activate; then
            echo 'failed health gate was masked by a later successful command' >&2
            exit 1
          fi
          EOF
          } | bash

          rendered="$(
            ASTRACODE_JUDGE_DEPLOY_DRY_RUN=1 \
            ASTRACODE_JUDGE_COMPOSE=./environment/judge-node.compose.ci.yml \
            ASTRACODE_JUDGE_CONFIG=./workers/judge/config/config.yaml \
            ASTRACODE_JUDGE_STATE_DIR=/tmp/astracode-judge-state \
            ./scripts/deploy-judge-node.sh v0.0.0-ci
          )"
          grep -Fqx '    image: ghcr.io/nvawntien/go-judge-system/sandbox:v0.0.0-ci' <<<"$rendered"
          grep -Fqx '    image: ghcr.io/nvawntien/go-judge-system/judge-worker:v0.0.0-ci' <<<"$rendered"

  judge-benchmark:
    name: Judge benchmark harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25.8'
          cache: false

      - name: Test benchmark harness and collector syntax
        working-directory: tools/benchmark/judge
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
          bash -n scripts/collect-container-stats.sh
          bash -n scripts/collect-kafka-lag.sh

  image-scope:
    name: Classify image build changes
    if: >-
      github.event_name == 'pull_request' && !inputs.git_ref &&
      startsWith(github.workflow_ref, format('{0}/.github/workflows/ci.yml@', github.repository))
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        continue-on-error: true # Only the classification checkout is optional.
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare PR base and head
        id: changes
        if: steps.checkout.outcome == 'success'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changes="$RUNNER_TEMP/image-build-changes"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! merge_base=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA") ||
             [[ ! "$merge_base" =~ ^[0-9a-f]{40}$ ]] ||
             ! git diff --raw -z --no-ext-diff --no-renames "$merge_base" "$HEAD_SHA" -- >"$changes" ||
             [[ ! -s "$changes" ]]; then
            echo "PR changes could not be classified. Build all images."
            exit 0
          fi

          # Disabled rename detection checks both paths of every rename.
          while IFS= read -r -d '' entry; do
            IFS= read -r -d '' path || exit 0
            read -r old_mode new_mode _ <<< "${entry#:}"
            case "$old_mode:$new_mode" in
              100644:100644|000000:100644|100644:000000) ;;
              *) exit 0 ;;
            esac
            case "$path" in
              .github/workflows/*|.github/actions/*) exit 0 ;;
              *.md|docs/assets/*.svg) ;;
              *) exit 0 ;;
            esac
          done <"$changes"
          echo "docs_only=true" >>"$GITHUB_OUTPUT"

  images:
    name: Build image (${{ matrix.image }})
    needs: image-scope
    # Keep all six required checks, including when classification is unavailable.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: website
            context: ./website
            dockerfile: ./website/Dockerfile
          - image: auth-service
            context: .
            dockerfile: ./services/auth/Dockerfile
          - image: problem-service
            context: .
            dockerfile: ./services/problem/Dockerfile
          - image: submission-service
            context: .
            dockerfile: ./services/submission/Dockerfile
          - image: judge-worker
            context: .
            dockerfile: ./workers/judge/Dockerfile
          - image: sandbox
            context: .
            dockerfile: ./build/sandbox/Dockerfile
    steps:
      - name: Report documentation-only build skip
        if: needs.image-scope.outputs.docs_only == 'true'
        run: echo "Documentation-only PR. Docker build skipped."

      - name: Check out repository
        if: needs.image-scope.outputs.docs_only != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Docker Buildx
        if: needs.image-scope.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.29.1
          driver-opts: image=moby/buildkit:v0.25.1@sha256:79cc6476ab1a3371c9afd8b44e7c55610057c43e18d9b39b68e2b0c2475cc1b6

      - name: Build without publishing
        if: needs.image-scope.outputs.docs_only != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: local/astracode-${{ matrix.image }}:ci
          build-args: |
            VERSION=ci
            BUILD_TIME=${{ github.event.repository.updated_at }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release-evidence:
    name: Record exact release verification
    if: inputs.git_ref != ''
    needs: [go, postgres-integration, frontend, edge, compose, deployment-scripts, judge-benchmark, images]
    runs-on: ubuntu-24.04
    steps:
      - name: Record successful module and image checks
        env:
          SOURCE: ${{ inputs.git_ref }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          assert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE'])
          checks={k:v['result'] for k,v in json.loads(os.environ['RESULTS']).items()}
          assert set(checks.values())=={'success'}
          Path('ci.json').write_text(json.dumps(dict(source=os.environ['SOURCE'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],checks=checks,repository=os.environ['GITHUB_REPOSITORY'],run_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/attempts/'+os.environ['GITHUB_RUN_ATTEMPT'])))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-evidence-${{ inputs.git_ref }}
          path: ci.json
          if-no-files-found: error
