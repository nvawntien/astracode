          http_filters:
          - name: envoy.filters.http.header_mutation
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: x-user-id
                - remove: x-role
                - remove: x-username
                - remove: x-token-iat
                - remove: x-client-ip
                - remove: x-forwarded-for
                - remove: x-forwarded-host
                - remove: x-forwarded-proto
                - remove: x-real-ip
                - remove: forwarded
          - name: envoy.filters.http.lua
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              clear_route_cache: false
              default_source_code:
                filename: /etc/envoy/edge.lua
          - name: envoy.filters.http.cors
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.jwt_authn
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                access_token:
                  local_jwks:
                    filename: /etc/envoy/secrets/symmetric.json
                  from_cookies:
                  - access_token
                  from_headers:
                  - name: Authorization
                    value_prefix: 'Bearer '
                  forward: true
                  clock_skew_seconds: 60
                  payload_in_metadata: verified
                  claim_to_headers:
                  - claim_name: sub
                    header_name: x-user-id
                  - claim_name: role
                    header_name: x-role
                  - claim_name: username
                    header_name: x-username
                  - claim_name: iat
                    header_name: x-token-iat
              requirement_map:
                access_token:
                  provider_name: access_token
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  edge_contract:
                    permissions:
                    - and_rules:
                        rules:
                        - metadata:
                            filter: astracode.edge
                            path:
                            - key: sanitized
                            value:
                              bool_match: true
                    principals:
                    - any: true
          - name: envoy.filters.http.lua
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              clear_route_cache: false
              default_source_code:
                inline_string: "function envoy_on_request(handle)\n  if handle:headers():get(\":method\") == \"\
                  OPTIONS\" and handle:headers():get(\":path\"):sub(1, 5) == \"/api/\" then\n    handle:respond({[\"\
                  :status\"] = \"404\"}, \"\")\n    return\n  end\n\nend\n"
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
